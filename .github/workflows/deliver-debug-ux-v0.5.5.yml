name: Verify and deliver sui-code v0.5.5
on:
  push:
    branches: [sui-code/v0.5.5-debug-ux]
    paths:
      - '.delivery/sui-code-v0.5.5-candidate/**'
      - '.github/workflows/deliver-debug-ux-v0.5.5.yml'
      - 'tools/ide_reliability/*v055*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sui-code-v055-verified-delivery
  cancel-in-progress: true
jobs:
  android:
    if: github.repository == 'suidi-guliu/j-code-android' && github.ref == 'refs/heads/sui-code/v0.5.5-debug-ux'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        mode: [upgrade, fresh]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the candidate identity and prepare the retained-data fixture
        run: |
          set -euo pipefail
          candidate=.delivery/sui-code-v0.5.5-candidate
          (cd "$candidate" && sha256sum --check --strict SHA256SUMS)
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          certificate() { "$apksigner" verify --print-certs "$1" | awk '/certificate SHA-256 digest:/ {print $NF}'; }
          old_cert=$(certificate .delivery/sui-code-v0.5.4/sui-code-v0.5.4-debug.apk)
          test "$old_cert" = 62c2da3484d337626eac6711e5ea7015913e23b8932e9f2b2bd220b843579fa0
          test "$(certificate "$candidate/sui-code-v0.5.5-debug.apk")" = "$old_cert"
          test "$(certificate "$candidate/sui-code-v0.5.5-androidTest.apk")" = "$old_cert"
          "$(dirname "$apksigner")/aapt" dump badging "$candidate/sui-code-v0.5.5-debug.apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='dev.suicode.ide.debug' versionCode='1070808' versionName='0.5.5'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -p "$candidate/sui-code-v0.5.5-debug.apk" lib/arm64-v8a/libjcode_wasm.so > "$RUNNER_TEMP/libjcode_wasm.so"
          test -s "$RUNNER_TEMP/libjcode_wasm.so"
          mkdir "$RUNNER_TEMP/v055-inputs"
          unzip -j "$candidate/upgrade-fixture.zip" -d "$RUNNER_TEMP/v055-inputs"
          unzip -j .delivery/sui-code-v0.5.4/android-test-inputs.zip startup-androidTest.apk -d "$RUNNER_TEMP/v055-inputs"
      - name: Set up an owned Android 16 tablet emulator
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-36;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/v055-avds"
          mkdir "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n sui-v055-${{ matrix.mode }} -k 'system-images;android-36;google_apis;x86_64' -d pixel_c --force
          sudo apt-get update
          sudo apt-get install -y python3-debugpy
      - name: Run real Android 16 instrumentation and UI checks
        run: bash tools/ide_reliability/run_emulator_v055.sh ${{ matrix.mode }}
      - name: Preserve Android logs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v055-android-${{ matrix.mode }}-evidence
          path: ${{ runner.temp }}/v055-evidence/
          if-no-files-found: warn
  ubuntu:
    if: github.repository == 'suidi-guliu/j-code-android' && github.ref == 'refs/heads/sui-code/v0.5.5-debug-ux'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Exercise the production JVM services with real Ubuntu tools and PTYs
        run: |
          set -euo pipefail
          (cd .delivery/sui-code-v0.5.5-candidate && sha256sum --check --strict SHA256SUMS)
          bash tools/ide_reliability/run_ubuntu_v055.sh
      - name: Preserve real Ubuntu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v055-ubuntu-evidence
          path: ${{ runner.temp }}/v055-ubuntu/evidence/
          if-no-files-found: warn
  deliver:
    needs: [android, ubuntu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: v055-android-*-evidence
          merge-multiple: true
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: v055-ubuntu-evidence
          path: ubuntu-evidence
      - name: Require both Android receipts and assemble the integrated download
        run: |
          set -euo pipefail
          for mode in upgrade fresh; do
            jq -e --arg mode "$mode" '.mode == $mode and .result == "PASS" and .android_instrumentation_tests == 17 and .physical_arm64 == false' "evidence/$mode/result.json"
          done
          for language in Python Java C C_CPP; do
            jq -e 'length == 8 and all(.[]; .result == "PASS")' "ubuntu-evidence/debug-$language/debug-input-results.json"
          done
          jq -e 'length == 2 and all(.[]; .result == "PASS")' ubuntu-evidence/clangd/cpp-definition-results.json
          jq -e 'length == 49 and all(.[]; .result == "PASS")' ubuntu-evidence/tasks/task-results.json
          mkdir release
          candidate=.delivery/sui-code-v0.5.5-candidate
          cp "$candidate/sui-code-v0.5.5-debug.apk" "$candidate/report.md" "$candidate/linux-evidence.zip" "$candidate/native-sdk.zip" release/
          cp native-library/v1/{Java,C_CPP,Python}.suik localization/releases/sui-code-zh-hans-1.0.2.suik release/
          (cd evidence && zip -qr ../release/android-evidence.zip .)
          (cd ubuntu-evidence && zip -qr ../release/ubuntu-evidence.zip .)
          git fetch --no-tags --depth=1 origin 4a19b04ec7406f6c25683142a735a9d137403a6f
          git diff --binary 4a19b04ec7406f6c25683142a735a9d137403a6f HEAD -- . ':(exclude).delivery' > release/changes.patch
          printf '\nUbuntu 24.04 x64 PRoot passed 32 debug scenarios, 20 clangd definition checks and 49 task scenarios.\n\nAndroid 16 fresh and retained-data upgrade passed in x86_64 AVDs with an ARM64 native bridge. Physical ARM64 tablet acceptance is pending.\n\nhttps://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release/report.md
          (cd release && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: sui-code-v0.5.5-integrated
          path: release/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: roundtrip
      - name: Verify the downloadable bytes
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          (cd roundtrip && sha256sum --check --strict SHA256SUMS)
          printf '[Download the integrated APK, Kit updates and evidence](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
